# Cấu hình dự án sea-vi-crawler, quản lý thư viện bằng uv (uv sync / uv run).
[project]
name = "sea-vi-crawler"
version = "0.1.0"
description = "Tải phần tiếng Việt của SEA-PILE-v2, SEA-LION-Pile v1, SEA-Instruct-2602 từ Hugging Face, có checkpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
# chỉ cần khi phát triển / chạy test
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
